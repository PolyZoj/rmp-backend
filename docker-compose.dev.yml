
x-build-args: &build-args
  BUILDKIT_INLINE_CACHE: 1
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

x-microservice-common: &microservice-common
  # Для режима разработки уменьшаем количество реплик до 1
  deploy:
    replicas: 1
    resources:
      limits:
        cpus: "0.75"
        memory: 512M
  restart: on-failure
  networks:
    - backend_net
  labels:
    - "com.docker.compose.project=rmp-backend"

services:
  # Databases
  psql_users_master:
    build:
      context: ./db/template
    image: rmp-backend-psql_users_master
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data
      PGENCODING: UTF8
      PGLOCALE: en_US.UTF-8
      REPL_PASSWORD: ${DB_REPL_PASSWORD:-repl_pass}
      PEER_HOST: psql_users_replica
      ROLE: master
    entrypoint: ["/home/scripts/custom-entrypoint.sh"]
    volumes:
      - psql_users_master_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend_net
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 10
    labels:
      - "com.docker.compose.project=rmp-backend"
      - "com.docker.compose.service=psql_users"

  # Реплика БД пользователей для операций чтения
  psql_users_replica:
    build:
      context: ./db/template
    image: rmp-backend-psql_users_replica
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data
      PGENCODING: UTF8
      PGLOCALE: en_US.UTF-8
      REPL_PASSWORD: ${DB_REPL_PASSWORD:-repl_pass}
      PEER_HOST: psql_users_master
      ROLE: hot_standby
    entrypoint: ["/home/scripts/custom-entrypoint.sh"]
    volumes:
      - psql_users_replica_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      - psql_users_master
    networks:
      - backend_net
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 10
    labels:
      - "com.docker.compose.project=rmp-backend"
      - "com.docker.compose.service=psql_users_replica"
