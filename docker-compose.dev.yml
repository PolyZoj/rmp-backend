#      - CLICKHOUSE_HOST=clickhouse
#      - CLICKHOUSE_PORT=8123
#      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
#    <<: *microservice-common

  # Прокси для сервисов
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8081:8081"
      - "8082:8082"
      - "8083:8083"
      - "8084:8084"
      - "8085:8085"
    depends_on:
      - auth-service
      - user
      - stats
      - challenges
      - club-service
      - club-gateway
    networks:
      - backend_net
    <<: *microservice-common

volumes:
  psql_users_master_data:
    labels:
      - "com.docker.compose.project=rmp-backend"
      - "com.docker.compose.volume=psql_users_master_data"
  psql_users_replica_data:
    labels:
      - "com.docker.compose.project=rmp-backend"
      - "com.docker.compose.volume=psql_users_replica_data"
  psql_club_master_data:
    labels:
      - "com.docker.compose.project=rmp-backend"
      - "com.docker.compose.volume=psql_club_master_data"
  psql_club_replica_data:
    labels:
      - "com.docker.compose.project=rmp-backend"
      - "com.docker.compose.volume=psql_club_replica_data"
  psql_challenges_master_data:
    labels:
      - "com.docker.compose.project=rmp-backend"
      - "com.docker.compose.volume=psql_challenges_master_data"
  psql_challenges_replica_data:
    labels:
      - "com.docker.compose.project=rmp-backend"
      - "com.docker.compose.volume=psql_challenges_replica_data"
  clickhouse_data:
    labels:
      - "com.docker.compose.project=rmp-backend"
      - "com.docker.compose.volume=clickhouse_data"
  kafka_data:
    labels:
      - "com.docker.compose.project=rmp-backend"
      - "com.docker.compose.volume=kafka_data"

networks:
  backend_net:
    driver: overlay
    labels:
      - "com.docker.compose.project=rmp-backend"
      - "com.docker.compose.network=backend_net"
