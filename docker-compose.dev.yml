x-build-args: &build-args
  BUILDKIT_INLINE_CACHE: 1
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

x-microservice-common: &microservice-common
  # Для режима разработки уменьшаем количество реплик до 1
  deploy:
    replicas: 1
    resources:
      limits:
        cpus: "0.75"
        memory: 512M
  restart: on-failure
  networks:
    - backend_net
  labels:
    - "com.docker.compose.project=rmp-backend"

services:
  # Databases
  psql_users_master:
    build:
      context: ./db/template
    image: rmp-backend-psql_users_master
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data
      PGENCODING: UTF8
      PGLOCALE: en_US.UTF-8
      REPL_PASSWORD: ${DB_REPL_PASSWORD:-repl_pass}
      PEER_HOST: psql_users_replica
      ROLE: master
    entrypoint: ["/home/scripts/custom-entrypoint.sh"]
    volumes:
      - psql_users_master_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend_net
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 10
    labels:
      - "com.docker.compose.project=rmp-backend"
      - "com.docker.compose.service=psql_users"

  # Реплика БД пользователей для операций чтения
  psql_users_replica:
    build:
      context: ./db/template
    image: rmp-backend-psql_users_replica
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data
      PGENCODING: UTF8
      PGLOCALE: en_US.UTF-8
      REPL_PASSWORD: ${DB_REPL_PASSWORD:-repl_pass}
      PEER_HOST: psql_users_master
      ROLE: hot_standby
    entrypoint: ["/home/scripts/custom-entrypoint.sh"]
    volumes:
      - psql_users_replica_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      - psql_users_master
    networks:
      - backend_net
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 10
    labels:
      - "com.docker.compose.project=rmp-backend"
      - "com.docker.compose.service=psql_users_replica"



  psql_club_master:
    build:
      context: ./db/template
    image: rmp-backend-psql_club_master
    environment:
      POSTGRES_DB: club_db
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data
      PGENCODING: UTF8
      PGLOCALE: en_US.UTF-8
      REPL_PASSWORD: ${DB_REPL_PASSWORD:-repl_pass}
      PEER_HOST: psql_club_replica
      ROLE: master
    entrypoint: ["/home/scripts/custom-entrypoint.sh"]
    volumes:
      - psql_club_master_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend_net
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 10
    labels:
      - "com.docker.compose.project=rmp-backend"
      - "com.docker.compose.service=psql_club"

  # Реплика БД пользователей для операций чтения
  psql_club_replica:
    build:
      context: ./db/template
    image: rmp-backend-psql_club_replica
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data
      PGENCODING: UTF8
      PGLOCALE: en_US.UTF-8
      REPL_PASSWORD: ${DB_REPL_PASSWORD:-repl_pass}
      PEER_HOST: psql_club_master
      ROLE: hot_standby
    entrypoint: ["/home/scripts/custom-entrypoint.sh"]
    volumes:
      - psql_club_replica_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      - psql_club_master
    networks:
      - backend_net
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 10
    labels:
      - "com.docker.compose.project=rmp-backend"
      - "com.docker.compose.service=psql_club_replica"


  psql_challenges_master:
    build:
      context: ./db/template
    image: rmp-backend-psql_challenges_master
    environment:
      POSTGRES_DB: challenges_db
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data
      PGENCODING: UTF8
      PGLOCALE: en_US.UTF-8
      REPL_PASSWORD: ${DB_REPL_PASSWORD:-repl_pass}
      PEER_HOST: psql_challenges_replica
      ROLE: master
    entrypoint: [ "/home/scripts/custom-entrypoint.sh" ]
    volumes:
      - psql_challenges_master_data:/var/lib/postgresql/data
    ports:
      - "5436:5432"
    healthcheck:
      test: [ "CMD-SHELL","pg_isready -U ${DB_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend_net
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 10
    labels:
      - "com.docker.compose.project=rmp-backend"
      - "com.docker.compose.service=psql_challenges"

  # Реплика БД пользователей для операций чтения
  psql_challenges_replica:
    build:
      context: ./db/template
    image: rmp-backend-psql_challenges_replica
    environment:
      POSTGRES_DB: challenges_db
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data
      PGENCODING: UTF8
      PGLOCALE: en_US.UTF-8
      REPL_PASSWORD: ${DB_REPL_PASSWORD:-repl_pass}
      PEER_HOST: psql_challenges_master
      ROLE: hot_standby
    entrypoint: [ "/home/scripts/custom-entrypoint.sh" ]
    volumes:
      - psql_challenges_replica_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: [ "CMD-SHELL","pg_isready -U ${DB_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      - psql_challenges_master
    networks:
      - backend_net
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 10
    labels:
      - "com.docker.compose.project=rmp-backend"
      - "com.docker.compose.service=psql_challenges_replica"

  clickhouse:
    image: clickhouse/clickhouse-server:23.3      
    ports:
      - "8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/initdb.d:/docker-entrypoint-initdb.d:ro
    depends_on:
      - kafka
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      CLICKHOUSE_USER: "def"
      CLICKHOUSE_PASSWORD: "def"
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 10

  # Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.4
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "22181:2181"
    <<: *microservice-common

  kafka:
    image: confluentinc/cp-kafka:7.4.4
    hostname: kafka
    depends_on:
      - zookeeper
    ports:
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: [ "CMD", "bash", "-c", "cub kafka-ready -b localhost:9092 1 20" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    <<: *microservice-common
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 10

  # Microservices

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
      args:
        SERVICE: auth-service
        <<: *build-args
    image: rmp-backend-auth-service
    depends_on:
      - kafka
      - redis
    expose:
      - "8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_AUDIENCE: jwt-audience
      JWT_DOMAIN: https://jwt-provider-domain
      JWT_REALM: ktor-realm
      JWT_SECRET: secret
    <<: *microservice-common
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M

  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"
    networks:
      - backend_net

  user-interface:
    build:
      context: .
      dockerfile: user-interface/Dockerfile
      args:
        SERVICE: user-interface
        <<: *build-args
    image: rmp-backend-user-interface
    depends_on:
      - psql_users_master
      - psql_users_replica
      - kafka
    expose:
      - "8080"
    environment:
      DB_HOST_MASTER: psql_users_master
      DB_PORT_MASTER: 5432
      DB_HOST_REPLICA: psql_users_replica
      DB_PORT_REPLICA: 5432
      DB_NAME: user_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    <<: *microservice-common
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
      args:
        SERVICE: user-service
        <<: *build-args
    image: rmp-backend-user-service
    depends_on:
      - kafka
      - user-interface
    expose:
      - "8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    <<: *microservice-common
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M

  user:
    build:
      context: .
      dockerfile: user/Dockerfile
      args:
        SERVICE: user
        <<: *build-args
    image: rmp-backend-user
    depends_on:
      - user-service
      - kafka
    expose:
      - "8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    <<: *microservice-common
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M

  club-gateway:
    build:
      context: .
      dockerfile: club/Dockerfile
      args:
        SERVICE: club
        <<: *build-args
    image: rmp-backend-club
    depends_on:
      - kafka
    expose:
      - "8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    <<: *microservice-common
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M

  stats:
    build:
      context: .
      dockerfile: ./stats/Dockerfile
      args:
        SERVICE: stats
        <<: *build-args
    image: rmp-backend-stats
    ports:
      - "8080"
    depends_on:
      - redis
      - kafka
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    <<: *microservice-common
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M

  stats-interface:
    build:
      context: .
      dockerfile: ./stats-interface/Dockerfile
      args:
        SERVICE: stats-interface
        <<: *build-args
    image: rmp-backend-stats-interface
    ports:
      - "8080"
    depends_on:
      - redis
      - kafka
      - clickhouse
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - CLICKHOUSE_USER=def
      - CLICKHOUSE_PASSWORD=def
    restart: always
    <<: *microservice-common
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M

  club-service:
    build:
      context: .
      dockerfile: club-service/Dockerfile
      args:
        SERVICE: club-service
        <<: *build-args
    image: rmp-backend-club-service
    depends_on:
      - club-gateway
      - kafka
    expose:
      - "8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    <<: *microservice-common
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M

  club-interface:
    build:
      context: .
      dockerfile: club-interface/Dockerfile
      args:
        SERVICE: club-interface
        <<: *build-args
    image: rmp-backend-club-interface
    depends_on:
      - psql_club_master
      - psql_club_replica
      - kafka
    expose:
      - "8080"
    environment:
      DB_HOST_MASTER: psql_club_master
      DB_PORT_MASTER: 5432
      DB_HOST_REPLICA: psql_club_replica
      DB_PORT_REPLICA: 5432
      DB_NAME: club_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    <<: *microservice-common
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M

  challenges-interface:
    build:
      context: .
      dockerfile: challenges-interface/Dockerfile
      args:
        SERVICE: challenges-interface
        <<: *build-args
    image: rmp-backend-challenges-interface
    depends_on:
      - psql_challenges_master
      - psql_challenges_replica
      - kafka
    expose:
      - "8080"
    environment:
      DB_HOST_MASTER: psql_challenges_master
      DB_PORT_MASTER: 5432
      DB_HOST_REPLICA: psql_challenges_replica
      DB_PORT_REPLICA: 5432
      DB_NAME: challenges_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    <<: *microservice-common
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M

  challenges-service:
    build:
      context: .
      dockerfile: challenges-service/Dockerfile
      args:
        SERVICE: challenges-service
        <<: *build-args
    image: rmp-backend-challenges-service
    depends_on:
      - kafka
      - challenges-interface
    expose:
      - "8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    <<: *microservice-common
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M

  challenges:
    build:
      context: .
      dockerfile: challenges/Dockerfile
      args:
        SERVICE: challenges
        <<: *build-args
    image: rmp-backend-challenges
    depends_on:
      - challenges-service
      - kafka
    expose:
      - "8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    <<: *microservice-common
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M

#  log-service:
#    build:
#      context: .
#      dockerfile: log-service/Dockerfile
#      args:
#        <<: *build-args
#        SERVICE: log-service
#    image: rmp-backend-log-service
#    depends_on:
#      - clickhouse
#      - kafka
#    expose:
#      - "8080"
