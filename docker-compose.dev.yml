version: '3.8'

# Файл для быстрой разработки, который перезаписывает некоторые настройки из основного docker-compose.yml

x-build-args: &build-args
  BUILDKIT_INLINE_CACHE: 1
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1
  SKIP_TESTS: "true" # Пропускаем тесты в режиме разработки

x-microservice-dev-common: &microservice-dev-common
  # Монтируем локальный Gradle кэш для ускорения разработки
  volumes:
    - type: bind
      source: ~/.gradle
      target: /home/gradle/.gradle
      read_only: true
  # Для режима разработки уменьшаем количество реплик до 1
  deploy:
    replicas: 1
    resources:
      limits:
        cpus: "0.75"
        memory: 512M
  # Добавляем горячую перезагрузку через объем для исходного кода
  environment:
    - SPRING_PROFILES_ACTIVE=dev
  labels:
    - "com.docker.compose.project=rmp-backend"
    - "com.docker.compose.environment=dev"

services:
  # Базы данных
  psql_users:
    ports:
      - "5433:5432"
    volumes:
      - ./user-service/src/main/resources/db/migration:/docker-entrypoint-initdb.d
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  psql_users_replica:
    ports:
      - "5436:5432"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # Публичные сервисы
  auth-service:
    build:
      args:
        <<: *build-args
    <<: *microservice-dev-common

  user-service:
    build:
      args:
        <<: *build-args
    environment:
      - DB_HOST_WRITER=psql_users
      - DB_PORT_WRITER=5432
      - DB_HOST_READER=psql_users_replica
      - DB_PORT_READER=5432
      - DB_NAME=user_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - SPRING_PROFILES_ACTIVE=dev
    <<: *microservice-dev-common

  notification-service:
    build:
      args:
        <<: *build-args
    <<: *microservice-dev-common

  challenges-service:
    build:
      args:
        <<: *build-args
    <<: *microservice-dev-common

  club-service:
    build:
      args:
        <<: *build-args
    <<: *microservice-dev-common

  # Внутренние сервисы
  payment-service:
    build:
      args:
        <<: *build-args
    <<: *microservice-dev-common

  stats-service:
    build:
      args:
        <<: *build-args
    <<: *microservice-dev-common

  gamification-service:
    build:
      args:
        <<: *build-args
    <<: *microservice-dev-common

  log-service:
    build:
      args:
        <<: *build-args
    <<: *microservice-dev-common

volumes:
  postgres_data: