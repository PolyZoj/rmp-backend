# --- Connection Settings
listen_addresses = '*'

# --- Replication Settings
wal_level = replica
wal_keep_size = 64MB
max_wal_senders = 10
max_replication_slots = 10
synchronous_commit = off        # asynchronous for speed

# --- Archiving
archive_mode = on
archive_command = 'echo "dummy archive" >> /var/log/postgresql/archive.log'

# --- Logging
log_connections = on
log_disconnections = on
log_duration = on
log_checkpoints = on
log_min_duration_statement = 500ms

# --- Memory
shared_buffers = 1GB
effective_cache_size = 3GB

# --- Work Areas
work_mem = 16MB
maintenance_work_mem = 128MB

# --- WAL & Checkpoints
checkpoint_completion_target = 0.7
max_wal_size = 1GB
min_wal_size = 80MB
wal_compression = on            # reduce WAL I/O

# --- Additional Settings
wal_log_hints = on
