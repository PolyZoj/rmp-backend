version: '3.8'

x-microservice-common: &microservice-common
  restart: on-failure
  networks:
    - backend_net
  labels:
    - "com.docker.compose.project=rmp-backend"

services:
  auth-service:
    build: ./auth-service
    ports:
      - "8080"
    depends_on:
      - redis
      - kafka
    environment:
      - JWT_AUDIENCE=jwt-audience
      - JWT_DOMAIN=https://jwt-provider-domain
      - JWT_REALM=ktor-realm
      - JWT_SECRET=secret
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    networks:
      - backend_net

  user-service:
    build: ./user-service
    ports:
      - "8080"
    depends_on:
      - redis
      - kafka
    environment:
      - JWT_AUDIENCE=jwt-audience
      - JWT_DOMAIN=https://jwt-provider-domain
      - JWT_REALM=ktor-realm
      - JWT_SECRET=secret
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    networks:
      - backend_net

  club-service:
    build: ./club-service
    ports:
      - "8080"
    depends_on:
      - redis
      - kafka
      - club-gateway
    environment:
      - JWT_AUDIENCE=jwt-audience
      - JWT_DOMAIN=https://jwt-provider-domain
      - JWT_REALM=ktor-realm
      - JWT_SECRET=secret
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    networks:
      - backend_net

  club-gateway:
    build: ./club
    ports:
      - "8080"
    depends_on:
      - redis
      - kafka
    environment:
      - JWT_AUDIENCE=jwt-audience
      - JWT_DOMAIN=https://jwt-provider-domain
      - JWT_REALM=ktor-realm
      - JWT_SECRET=secret
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    networks:
      - backend_net
  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"
    networks:
      - backend_net

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8081:8081"
      - "8082:8082"
      - "8083:8083"
      - "8084:8084"
      - "8085:8085"
    depends_on:
      - auth-service
      - club-gateway
    networks:
      - backend_net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.4
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "22181:2181"
    <<: *microservice-common
    
  kafka:
    image: confluentinc/cp-kafka:7.4.4
    hostname: kafka
    depends_on:
      - zookeeper
    ports:
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: [ "CMD", "bash", "-c", "cub kafka-ready -b localhost:9092 1 20" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    <<: *microservice-common
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 10

networks:
  backend_net:
    driver: bridge
