version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - redis
    environment:
      - JWT_AUDIENCE=jwt-audience
      - JWT_DOMAIN=https://jwt-provider-domain/
      - JWT_REALM=ktor-realm
      - JWT_SECRET=secret
    networks:
      - app-network

  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
