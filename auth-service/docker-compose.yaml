version: '3.8'

services:
  auth-service:
    build: .
    ports:
      - "8080"
    depends_on:
      - redis
    environment:
      - JWT_AUDIENCE=jwt-audience
      - JWT_DOMAIN=https://jwt-provider-domain
      - JWT_REALM=ktor-realm
      - JWT_SECRET=secret
    networks:
      - backend_net

  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"
    networks:
      - backend_net

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8081:8081"
      - "8082:8082"
      - "8083:8083"
      - "8084:8084"
      - "8085:8085"
    depends_on:
      - auth-service
    networks:
      - backend_net

networks:
  backend_net:
    driver: bridge
